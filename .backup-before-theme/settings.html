<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dock — 设置</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1e1e20;
    --bg-card: rgba(255,255,255,0.04);
    --bg-input: rgba(255,255,255,0.06);
    --text: #eee;
    --text-secondary: #ccc;
    --text-tertiary: #999;
    --text-muted: #666;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --accent: #0a84ff;
    --accent-hover: #409cff;
    --titlebar-text: #999;
  }
  body.theme-light {
    --bg: #f5f5f7;
    --bg-card: rgba(0,0,0,0.05);
    --bg-input: rgba(0,0,0,0.06);
    --text: #1d1d1f;
    --text-secondary: #555;
    --text-tertiary: #888;
    --text-muted: #999;
    --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.18);
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --titlebar-text: #888;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }
  .titlebar {
    display: flex; align-items: center; height: 38px; padding: 0 12px; flex-shrink: 0;
    -webkit-app-region: drag;
  }
  .window-title {
    flex: 1; text-align: center; font-size: 13px; color: var(--titlebar-text); font-weight: 500;
  }
  .body {
    flex: 1; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 0;
  }
  .section {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; border-bottom: 1px solid var(--border);
  }
  .section:last-of-type { border-bottom: none; }
  .section-info { flex: 1; min-width: 0; }
  .section-label { font-size: 13px; color: var(--text); margin-bottom: 2px; }
  .section-desc { font-size: 11px; color: var(--text-muted); }
  .toggle {
    width: 44px; height: 24px; border-radius: 12px; border: none;
    cursor: pointer; position: relative; transition: background 0.2s;
    flex-shrink: 0; outline: none;
  }
  .toggle.on { background: #30d158; }
  .toggle.off { background: #555; }
  .toggle::after {
    content: ''; position: absolute; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; top: 2px; transition: left 0.2s;
  }
  .toggle.on::after { left: 22px; }
  .toggle.off::after { left: 2px; }
  .select {
    background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text-secondary); padding: 6px 10px; border-radius: 5px; font-size: 12px;
    outline: none; cursor: pointer; flex-shrink: 0;
  }
  .select:focus { border-color: var(--accent); }
  .theme-toggle {
    display: flex; gap: 0; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border); flex-shrink: 0;
  }
  .theme-toggle button {
    padding: 6px 14px; border: none; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: background 0.15s; outline: none;
    background: transparent; color: var(--text-tertiary);
  }
  .theme-toggle button.active { background: var(--accent); color: #fff; }
  .footer {
    margin-top: auto; padding-top: 12px; text-align: center;
    font-size: 11px; color: var(--text-muted);
    border-top: 1px solid var(--border);
  }
  .btn-row {
    display: flex; justify-content: center; padding-top: 16px;
  }
  .btn-done {
    padding: 8px 32px; border-radius: 6px; border: none; font-size: 13px;
    cursor: pointer; font-family: inherit; font-weight: 500;
    background: var(--accent); color: #fff; transition: background 0.15s;
    -webkit-app-region: no-drag;
  }
  .btn-done:hover { background: var(--accent-hover); }
</style>
</head>
<body>
<div class="titlebar">
  <div class="window-title">Dock — 设置</div>
</div>
<div class="body">
  <div class="section">
    <div class="section-info">
      <div class="section-label">外观</div>
      <div class="section-desc">选择深色或浅色主题</div>
    </div>
    <div class="theme-toggle" id="themeToggle">
      <button data-theme="dark">深色</button>
      <button data-theme="light">浅色</button>
    </div>
  </div>
  <div class="section">
    <div class="section-info">
      <div class="section-label">开机自启</div>
      <div class="section-desc">登录时自动启动 Dock</div>
    </div>
    <button class="toggle off" id="toggleAutoStart"></button>
  </div>
  <div class="section">
    <div class="section-info">
      <div class="section-label">窗口模式</div>
      <div class="section-desc">启动时自动打开管理窗口</div>
    </div>
    <button class="toggle off" id="toggleOpenWindow"></button>
  </div>
  <div class="section">
    <div class="section-info">
      <div class="section-label">快捷键修饰键</div>
      <div class="section-desc" id="shortcutLabel">⌘ + 数字键</div>
    </div>
    <select class="select" id="shortcutMod">
      <option value="meta">⌘ Command</option>
      <option value="alt">⌥ Option</option>
      <option value="ctrl">⌃ Control</option>
      <option value="shift">⇧ Shift</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn-done" id="btnDone">完成</button>
  </div>
  <div class="footer">
    <span id="versionLabel">Dock v1.0.0</span>
  </div>
</div>
<script>
  let settings = { openAtLogin: true, openWindowOnStart: true, theme: 'dark' };
  
  async function load() {
    try { settings = await window.dockAPI.getSettings(); } catch(e) {}
    updateUI();
    applyTheme(settings.theme || 'dark');
    try {
      const ver = await window.dockAPI.getVersion();
      document.getElementById('versionLabel').textContent = 'Dock v' + ver;
    } catch(e) {}
  }
  
  function updateUI() {
    document.getElementById('toggleAutoStart').className = 'toggle ' + (settings.openAtLogin ? 'on' : 'off');
    document.getElementById('toggleOpenWindow').className = 'toggle ' + (settings.openWindowOnStart ? 'on' : 'off');
    // Update theme toggle buttons
    document.querySelectorAll('#themeToggle button').forEach(b => {
      b.className = b.dataset.theme === settings.theme ? 'active' : '';
    });
  }
  
  function applyTheme(theme) {
    if (theme === 'light') {
      document.body.classList.add('theme-light');
    } else {
      document.body.classList.remove('theme-light');
    }
  }
  
  async function save() {
    await window.dockAPI.saveSettings(settings);
  }
  
  document.getElementById('toggleAutoStart').addEventListener('click', () => {
    settings.openAtLogin = !settings.openAtLogin;
    updateUI(); save();
  });
  
  document.getElementById('toggleOpenWindow').addEventListener('click', () => {
    settings.openWindowOnStart = !settings.openWindowOnStart;
    updateUI(); save();
  });
  
  document.querySelectorAll('#themeToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      settings.theme = btn.dataset.theme;
      applyTheme(settings.theme);
      updateUI(); save();
    });
  });
  
  document.getElementById('shortcutMod').value = 'meta';
  document.getElementById('shortcutMod').addEventListener('change', function() {
    const labels = { meta: '⌘', alt: '⌥', ctrl: '⌃', shift: '⇧' };
    document.getElementById('shortcutLabel').textContent = labels[this.value] + ' + 数字键';
    settings.shortcutMod = this.value;
    save();
  });
  
  document.getElementById('btnDone').addEventListener('click', () => window.close());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.close();
  });
  
  load();
</script>
</body>
</html>
